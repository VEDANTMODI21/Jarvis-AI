[project]
name = "jarvis-ai"
version = "1.0.0"
description = "AI-powered voice assistant with web UI and cloud database."
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "openai==2.44.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "Werkzeug==3.1.3",
]

[tool.vercel]
entrypoint = "app:app"
